name: Security audit

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          registry-url: "https://registry.npmjs.org/"

      - name: Rewrite lockfile resolved URLs to public registry
        run: sed -i 's|npm-proxy.dev.databricks.com|registry.npmjs.org|g' package-lock.json

      - name: Run npm audit (registry.npmjs.org, lockfile-based)
        run: |
          npm audit \
            --registry=https://registry.npmjs.org/ \
            --audit-level=moderate \
            --omit=dev || \
            { echo "::warning::npm audit found moderate+ vulnerabilities in production deps"; exit 1; }

      - name: Run npm audit (full tree, JSON report for visibility)
        if: always()
        run: |
          npm audit --registry=https://registry.npmjs.org/ --json > npm-audit.json || true
          jq '{vulnerabilities: .metadata.vulnerabilities, totalDeps: .metadata.totalDependencies}' npm-audit.json || cat npm-audit.json

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-${{ github.sha }}
          path: npm-audit.json
          if-no-files-found: ignore
          retention-days: 30
